name: Release

# Publishes all public @agentcontext/* packages to npm (with provenance) and
# creates a GitHub release when a version tag such as v0.1.0 is pushed.
# Requires the repository secret NPM_TOKEN (an npm automation token with
# publish rights to the @agentcontext organization).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that the tag matches the package versions
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME#v}"

      - name: Lint, typecheck, test, build
        run: pnpm check

      - name: Benchmarks (release gate)
        run: pnpm bench

      - name: Pack and clean-install test
        run: node scripts/pack-test.mjs

      - name: Security audit (production dependencies)
        run: pnpm audit --prod --audit-level high

      - name: Publish to npm
        run: pnpm publish -r --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "AgentContext $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" benchmarks/reports/latest.md
        env:
          GH_TOKEN: ${{ github.token }}
