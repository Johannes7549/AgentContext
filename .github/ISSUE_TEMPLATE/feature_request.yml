name: Feature request
description: Suggest an improvement or new capability.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Requests are triaged against the current release scope. Items listed as v0.1
        non-goals (see docs/product/PRODUCT_SPEC.md §5) are collected for later versions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include example input/output if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      description: Does the proposal keep AgentContext's core principles?
      options:
        - label: Works without LLM calls or remote services by default
        - label: Keeps omissions recorded and recoverable
